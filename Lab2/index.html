<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Lab 2 - Vector Laboratory | Maja Jankuloska 132151</title>
  <style>
    body { margin: 0; overflow: hidden; background: #111; }
    canvas { display: block; }
    #info {
      position: absolute; top: 10px; left: 10px; margin: 0; padding: 10px 12px;
      color: #eee; background: rgba(0,0,0,0.6); font: 13px/1.5 monospace;
      pointer-events: none; white-space: pre;
    }
  </style>
  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
      }
    }
  </script>
</head>
<body>
<pre id="info"></pre>
<script type="module">
  // Lab 2 - The vector laboratory
  // Maja Jankuloska, ID 132151
  import * as THREE from 'three';
  import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
  import GUI from 'three/addons/libs/lil-gui.module.min.js';

  // ---------- MINIMUM 1: base template + AxesHelper ----------
  const scene = new THREE.Scene();
  const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
  camera.position.set(6, 5, 8);

  const renderer = new THREE.WebGLRenderer({ antialias: true });
  renderer.setSize(window.innerWidth, window.innerHeight);
  document.body.appendChild(renderer.domElement);

  const controls = new OrbitControls(camera, renderer.domElement);
  scene.add(new THREE.AxesHelper(6));
  scene.add(new THREE.AmbientLight(0xffffff, 0.8));

  // ---------- MINIMUM 2: vectors a, b as Vector3 + ArrowHelper ----------
  const a = new THREE.Vector3(3, 4, 0);
  const b = new THREE.Vector3(1, 0, 0);
  const origin = new THREE.Vector3(0, 0, 0);

  const arrowA = new THREE.ArrowHelper(new THREE.Vector3(1, 0, 0), origin, 1, 0xff4444);
  const arrowB = new THREE.ArrowHelper(new THREE.Vector3(1, 0, 0), origin, 1, 0x44ff44);
  const arrowSum = new THREE.ArrowHelper(new THREE.Vector3(1, 0, 0), origin, 1, 0xffff00);
  scene.add(arrowA, arrowB, arrowSum);

  // Updates an arrow from a vector; hides it for the zero vector (avoids NaN)
  function setArrow(arrow, v) {
    const len = v.length();
    if (len < 1e-6) { arrow.visible = false; return; }
    arrow.visible = true;
    arrow.setDirection(v.clone().normalize());
    arrow.setLength(len, Math.min(0.3, len * 0.3), Math.min(0.15, len * 0.15));
  }

  // ---------- CHALLENGE: plane n.p = d, ray r(t) = o + t*dir ----------
  const plane = { nx: 0, ny: 1, nz: 0.3, d: 1 };       // n . p = d
  const ray = { ox: -4, oy: 5, oz: 2, dx: 1, dy: -1, dz: -0.3 };

  const planeMesh = new THREE.Mesh(
    new THREE.PlaneGeometry(14, 14),
    new THREE.MeshBasicMaterial({ color: 0x3366ff, transparent: true, opacity: 0.3, side: THREE.DoubleSide })
  );
  scene.add(planeMesh);

  const rayArrow = new THREE.ArrowHelper(new THREE.Vector3(1, 0, 0), origin, 1, 0x00ffff);
  scene.add(rayArrow);

  const hitMine = new THREE.Mesh(new THREE.SphereGeometry(0.15, 16, 16), new THREE.MeshBasicMaterial({ color: 0xff00ff }));
  const hitThree = new THREE.Mesh(new THREE.SphereGeometry(0.25, 16, 16), new THREE.MeshBasicMaterial({ color: 0xffffff, wireframe: true }));
  scene.add(hitMine, hitThree);

  const raycaster = new THREE.Raycaster();
  const info = document.getElementById('info');
  const f = (v) => v.toFixed(3);
  const fv = (v) => `(${f(v.x)}, ${f(v.y)}, ${f(v.z)})`;

  function update() {
    // ----- MINIMUM 3: sum + dot product -----
    const sum = new THREE.Vector3().addVectors(a, b);
    const dot = a.dot(b);
    setArrow(arrowA, a);
    setArrow(arrowB, b);
    setArrow(arrowSum, sum);

    // ----- STANDARD 2: angle  cos(theta) = a.b / (|a||b|) -----
    let thetaTxt = 'undefined (zero vector)';
    const denom = a.length() * b.length();
    if (denom > 1e-6) {
      const cosT = THREE.MathUtils.clamp(dot / denom, -1, 1);
      thetaTxt = THREE.MathUtils.radToDeg(Math.acos(cosT)).toFixed(2) + '°';
    }

    // ----- CHALLENGE 1: ray-plane intersection, t = (d - n.o) / (n.dir) -----
    const n = new THREE.Vector3(plane.nx, plane.ny, plane.nz);
    const o = new THREE.Vector3(ray.ox, ray.oy, ray.oz);
    const dir = new THREE.Vector3(ray.dx, ray.dy, ray.dz);
    let rayTxt = '';

    if (n.length() < 1e-6 || dir.length() < 1e-6) {
      hitMine.visible = hitThree.visible = false;
      rayArrow.visible = false;
      planeMesh.visible = n.length() >= 1e-6;
      rayTxt = 'invalid plane normal or ray direction';
    } else {
      dir.normalize(); // so t equals the real distance
      // place the plane mesh: normal n, passing through the point (d/|n|^2) * n
      const nUnit = n.clone().normalize();
      planeMesh.visible = true;
      planeMesh.quaternion.setFromUnitVectors(new THREE.Vector3(0, 0, 1), nUnit);
      planeMesh.position.copy(n.clone().multiplyScalar(plane.d / n.lengthSq()));

      setArrow(rayArrow, dir.clone().multiplyScalar(12));
      rayArrow.position.copy(o);

      const nd = n.dot(dir);
      if (Math.abs(nd) < 1e-6) {
        hitMine.visible = hitThree.visible = false;
        rayTxt = 'n.dir = 0 -> ray parallel to plane, no intersection';
      } else {
        const t = (plane.d - n.dot(o)) / nd;
        if (t < 0) {
          hitMine.visible = hitThree.visible = false;
          rayTxt = `t = ${f(t)} < 0 -> plane is behind the ray`;
        } else {
          const p = o.clone().add(dir.clone().multiplyScalar(t)); // p = o + t*dir
          hitMine.visible = true;
          hitMine.position.copy(p);

          // ----- CHALLENGE 2: compare with THREE.Raycaster -----
          planeMesh.updateMatrixWorld(true);
          raycaster.set(o, dir);
          const hits = raycaster.intersectObject(planeMesh);
          if (hits.length) {
            hitThree.visible = true;
            hitThree.position.copy(hits[0].point);
            const diff = hits[0].point.distanceTo(p);
            rayTxt = `t = ${f(t)}\nmine      : ${fv(p)}\nRaycaster : ${fv(hits[0].point)}\nmatch     : ${diff < 1e-4 ? 'YES' : 'NO'} (diff ${diff.toExponential(2)})`;
          } else {
            hitThree.visible = false;
            rayTxt = `t = ${f(t)}\nmine      : ${fv(p)}\nRaycaster : no hit (point is outside the 14x14 plane mesh)`;
          }
        }
      }
    }

    info.textContent =
      `a = ${fv(a)}  (red)\n` +
      `b = ${fv(b)}  (green)\n` +
      `a + b = ${fv(sum)}  (yellow)\n` +
      `a.b = ${f(dot)}\n` +
      `theta = ${thetaTxt}\n\n` +
      `Ray-plane (ray cyan, hit magenta, Raycaster hit white)\n` + rayTxt;
  }

  // ---------- STANDARD 1: GUI panel ----------
  const gui = new GUI();
  const fa = gui.addFolder('Vector a');
  const fb = gui.addFolder('Vector b');
  ['x', 'y', 'z'].forEach((k) => {
    fa.add(a, k, -6, 6, 0.1).onChange(update);
    fb.add(b, k, -6, 6, 0.1).onChange(update);
  });
  const fp = gui.addFolder('Plane  n.p = d');
  ['nx', 'ny', 'nz'].forEach((k) => fp.add(plane, k, -1, 1, 0.1).onChange(update));
  fp.add(plane, 'd', -5, 5, 0.1).onChange(update);
  const fr = gui.addFolder('Ray  o + t*dir');
  ['ox', 'oy', 'oz'].forEach((k) => fr.add(ray, k, -8, 8, 0.1).onChange(update));
  ['dx', 'dy', 'dz'].forEach((k) => fr.add(ray, k, -1, 1, 0.1).onChange(update));

  // Verification preset: a = (3,4,0), b = (1,0,0) -> theta = 53.13°
  gui.add({ verify() { a.set(3, 4, 0); b.set(1, 0, 0); gui.controllersRecursive().forEach(c => c.updateDisplay()); update(); } }, 'verify').name('Verify a=(3,4,0), b=(1,0,0)');

  update();

  function animate() {
    requestAnimationFrame(animate);
    controls.update();
    renderer.render(scene, camera);
  }
  animate();

  window.addEventListener('resize', () => {
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
  });
</script>
</body>
</html>
